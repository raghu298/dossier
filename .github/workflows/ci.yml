name: CI

on:
  # Only release branches (release/1.12.0): when one is pushed, and on each push
  # after that. Other branches, pull requests and main aren't checked.
  push:
    branches: ["release/**"]
  # The public repository's image.yml (publish/overlay) runs these checks on
  # each publish to its main before building the image.
  workflow_call:

permissions:
  contents: read

# A newer push to the same release branch stops the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    services:
      # For the database tests (*.db.test.ts), which create and migrate their own
      # "dossier_test" database on this server.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dossier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dossier"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dossier
      # Same versions as the Dockerfile: Node 24 with the Yarn release pinned in
      # package.json (packageManager), installed through corepack.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: corepack enable

      - name: Locate the Yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - run: yarn install --immutable
      - run: yarn generate
      - run: yarn lint
      - run: yarn typecheck
      # Fails when coverage drops below the thresholds in vitest.config.mts (E11-1).
      - run: yarn test:coverage
      # The database tests again, against SQLite (DATABASE_URL=file:…).
      - name: Database tests on SQLite
        run: yarn vitest run --project db
        env:
          DATABASE_URL: file:${{ runner.temp }}/dossier.db
      - name: Coverage summary
        if: always()
        run: node .github/scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    services:
      # The tests create and migrate their own "dossier_e2e" database here.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dossier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dossier"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dossier
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: corepack enable

      - name: Locate the Yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - run: yarn install --immutable
      - run: yarn generate
      # Headless Chromium, for the tests and for the app's PDFs.
      - run: yarn playwright install --with-deps --only-shell chromium
      - run: yarn build
      - run: yarn test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
